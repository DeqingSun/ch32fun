name: Build CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # remove man-db to avoid slow trigger step
          sudo apt-get -yqq purge man-db || true
          sudo apt-get install -y --no-install-recommends \
            build-essential make libnewlib-dev gcc-riscv64-unknown-elf libusb-1.0-0-dev libudev-dev parallel

      - name: Build all examples (max 10 in parallel)
        run: |
          set -e
          find examples* -maxdepth 3 -name funconfig.h \
            | parallel -j 10 '
                dir=$(dirname {});
                echo "============================"
                echo "Building example: $dir"
                echo "============================"
                (cd "$dir" && make V=1 -j3 "$(basename "$dir").elf" 2>&1 && riscv64-unknown-elf-size "$(basename "$dir").elf")
            '

      - name: Collect CH32V003 binaries
        run: |
          chmod +x .github/collect_ch32v003_binaries.sh
          .github/collect_ch32v003_binaries.sh ch32v003-artifacts make examples*

      - uses: actions/upload-artifact@v4
        with:
          name: ch32v003-binaries-linux
          path: ch32v003-artifacts/make/
          if-no-files-found: error

  hardware-test-ch32v003:
    # Only run on trusted events (push or manual dispatch) to prevent
    # untrusted PR code from executing on the self-hosted runner.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-all
    runs-on: self-hosted
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ch32v003-binaries-linux
          path: ch32v003-firmware

      - name: Checkout test tool repo
        uses: actions/checkout@v4
        with:
          repository: DeqingSun/CH32V003-Automatic-Test-Tool
          path: CH32V003-Automatic-Test-Tool

      - name: Run hardware tests
        run: |
          python3 CH32V003-Automatic-Test-Tool/autoTestCode/selfhost_runner_test.py \
            $GITHUB_WORKSPACE/ch32v003-firmware

  build-all-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xPack GCC + Make
        shell: pwsh
        run: |
          ./misc/install_xpack_gcc.ps1 -SkipPrompts
      - name: Build all examples
        shell: cmd
        run: |
          cd build_scripts
          build_all.cmd

      - name: Collect CH32V003 binaries
        shell: bash
        run: |
          chmod +x .github/collect_ch32v003_binaries.sh
          .github/collect_ch32v003_binaries.sh ch32v003-artifacts make examples

      - uses: actions/upload-artifact@v4
        with:
          name: ch32v003-binaries-windows
          path: ch32v003-artifacts/make/
          if-no-files-found: error

  # Build using PlatformIO
  pio-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install PlatformIO Core
      run: pip install --upgrade platformio
    - name: Build PlatformIO Project
      run: pio run -v

    - name: Collect CH32V003 binaries
      shell: bash
      run: |
        chmod +x .github/collect_ch32v003_binaries.sh
        .github/collect_ch32v003_binaries.sh ch32v003-artifacts pio

    - uses: actions/upload-artifact@v4
      with:
        name: ch32v003-binaries-pio-${{ matrix.os }}
        path: ch32v003-artifacts/pio/
        if-no-files-found: error
